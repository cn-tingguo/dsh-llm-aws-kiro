<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kiro provider">
  <defs>
    <linearGradient id="kiroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#3d7bff"/>
    </linearGradient>
  </defs>
  <!-- Three model nodes feeding one vertex: a provider that routes choices. -->
  <circle cx="14" cy="16" r="6" fill="url(#kiroGradient)" opacity="0.55"/>
  <circle cx="14" cy="48" r="6" fill="url(#kiroGradient)" opacity="0.55"/>
  <circle cx="50" cy="32" r="7" fill="url(#kiroGradient)"/>
  <path d="M20 18.5 43 29M20 45.5 43 35" fill="none" stroke="url(#kiroGradient)"
        stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- The K stroke reads as the provider mark without borrowing the Kiro wordmark. -->
  <path d="M30 22v20M30 32.5 38 22M30 32.5 38 42" fill="none" stroke="#ffffff"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
